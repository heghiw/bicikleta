name: pedalshare
description: Peer-to-peer bike rental and redistribution — iOS & Android app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # HTTP / API
  http: ^1.2.0

  # Token storage
  flutter_secure_storage: ^9.2.2

  # Image picking (ID upload, selfie)
  image_picker: ^1.1.0

  # Icons
  cupertino_icons: ^1.0.8
  flutter_map: 8.3.1
  latlong2: 0.9.1
  shared_preferences: ^2.5.5
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  share_plus: ^12.0.2
  flutter_stripe: 12.1.1
  path_provider: ^2.1.6
  cross_file: ^0.3.5+4
  stripe_android: 12.1.0
  stripe_ios: 12.1.0
  stripe_platform_interface: 12.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
